<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2F5BEA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Spese</title>
<style>
:root{--bg:#EEF1F5;--card:#fff;--ink:#1B2433;--mut:#6B7686;--line:#DDE2EA;--acc:#2F5BEA;--onacc:#fff;--bad:#C2410C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--card:#1A212C;--ink:#E8ECF2;--mut:#93A0B3;--line:#2A3342;--acc:#6C8CFF;--onacc:#0B1020;--bad:#FB923C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{width:44px;height:44px;border:0;background:none;color:var(--acc);font-size:26px;cursor:pointer;border-radius:50%}
.nav h1{margin:0;font-size:17px;font-weight:600;text-transform:capitalize}
.total{position:relative;text-align:center;padding:8px 0 4px}
.total b{display:block;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.total span{color:var(--mut);font-size:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats div{flex:none;background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mut)}
.cats div b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.day{margin:18px 0 6px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;text-transform:capitalize}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--acc);color:var(--onacc);border:0;border-radius:999px;padding:15px 26px;font:600 16px -apple-system,system-ui,sans-serif;box-shadow:0 6px 20px rgba(47,91,234,.35);box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 38%,transparent);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input.amt{font-size:30px;font-weight:700;padding:10px 12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.pick button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;border:0;border-radius:12px;padding:14px;font:600 16px -apple-system,system-ui,sans-serif;cursor:pointer}
.save{background:var(--acc);color:var(--onacc)}
.cancel{background:var(--bg);color:var(--ink)}
.del{background:none;color:var(--bad);flex:0 0 auto!important}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.tabs{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:6px 0 4px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 15px -apple-system,system-ui,sans-serif;padding:8px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink)}
.bt{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px;margin-top:10px}
.bt th{font-size:13px;font-weight:600;color:var(--mut);text-align:right;padding:10px 8px}
.bt td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bt th:first-child,.bt td:first-child{text-align:left;padding-left:14px}
.bt td input{width:76px;text-align:right;font-size:16px;padding:7px 8px}
.bt tfoot td{font-weight:700;border-top:2px solid var(--line);padding:12px 8px}
.neg{color:var(--bad)}
.chart{display:flex;justify-content:center;gap:28px;align-items:flex-end;margin:24px 0 4px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:110px}
.chart .bar{width:64px;border-radius:6px 6px 0 0;min-height:3px}
.chart b{font-size:15px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.chart small{color:var(--mut);margin-top:8px;font-size:14px}
.dotbtn{position:absolute;top:11px;right:-5px;width:44px;height:44px;background:none;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.dotbtn i{width:26px;height:26px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--mut)}
.pop{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pop.on{display:flex}
.wheel{position:relative;width:min(86vw,340px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.wheel button{position:absolute;width:19%;aspect-ratio:1;border:0;border-radius:50%;padding:0;transform:translate(-50%,-50%);cursor:pointer}
.wheel button:focus-visible{outline:2px solid var(--ink);outline-offset:10px}
.wheel span{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font:600 16px -apple-system,system-ui,sans-serif;pointer-events:none}
.mini{background:none;border:0;color:var(--acc);font:600 14px -apple-system,system-ui,sans-serif;cursor:pointer;padding:4px 0 4px 12px}
#cscrim{z-index:8}
.save.dang{background:var(--bad);color:var(--bg)}
.link{display:block;margin:24px auto 0;background:none;border:0;color:var(--acc);font:inherit;padding:10px;cursor:pointer}
.hint{color:var(--mut);font-size:14px;margin:0 0 4px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <div class="nav">
      <button id="prev" aria-label="Mese precedente">‹</button>
      <h1 id="month"></h1>
      <button id="next" aria-label="Mese successivo">›</button>
    </div>
    <div class="total"><button class="dotbtn" id="cOpen" aria-label="Scegli il colore dell’app"><i></i></button><b id="total"></b><span id="count"></span></div>
  </header>
  <div class="tabs" role="group" aria-label="Vista">
    <button id="tabS" class="on" aria-pressed="true">Spese</button>
    <button id="tabB" aria-pressed="false">Budget</button>
  </div>
  <div class="cats" id="cats"></div>
  <div id="list"></div>
  <div id="bview" hidden>
    <table class="bt" id="bt"></table>
    <div class="chart" id="chart" role="img"></div>
  </div>
  <button class="link" id="bopen">Backup e ripristino</button>
</main>
<button class="fab" id="add">+ Aggiungi spesa</button>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <h2 id="stitle">Nuova spesa</h2>
    <label for="amt">Importo (€)</label>
    <input class="amt" id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <label>Categoria</label>
    <div class="pick" id="pick"></div>
    <label for="date">Data</label>
    <input type="date" id="date">
    <label for="note">Nota (facoltativa)</label>
    <input id="note" placeholder="Es. spesa al supermercato" autocomplete="off">
    <div class="err" id="err" role="alert"></div>
    <div class="btns">
      <button class="del" id="del" hidden>Elimina</button>
      <button class="cancel" id="cancel">Annulla</button>
      <button class="save" id="save">Salva spesa</button>
    </div>
  </div>
</div>

<div class="scrim" id="fscrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <h2 id="ftitle">Nuova spesa fissa</h2>
    <label for="fname">Nome</label>
    <input id="fname" placeholder="Es. Affitto" autocomplete="off">
    <label for="famt">Importo mensile (€)</label>
    <input class="amt" id="famt" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <p class="hint" id="fhint" style="margin-top:10px"></p>
    <div class="err" id="ferr" role="alert"></div>
    <div class="btns">
      <button class="del" id="fdel" hidden>Elimina</button>
      <button class="cancel" id="fcancel">Annulla</button>
      <button class="save" id="fsave">Salva</button>
    </div>
  </div>
</div>

<div class="scrim" id="cscrim">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="cmsg">
    <p id="cmsg" style="margin:0;font-size:17px"></p>
    <div class="btns"><button class="cancel" id="cno">Annulla</button><button class="save" id="cyes">Conferma</button></div>
  </div>
</div>

<div class="pop" id="pop"><div class="wheel" id="wheel" role="dialog" aria-modal="true" aria-label="Scegli il colore principale"><span id="cName"></span></div></div>

<div class="scrim" id="bscrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="btitle">
    <h2 id="btitle">Backup e ripristino</h2>
    <p class="hint" id="bstat"></p>
    <div class="btns"><button class="cancel" id="bexp">Salva file</button><button class="cancel" id="bimp">Importa file</button></div>
    <input type="file" id="bfile" accept="application/json,.json" hidden>
    <label for="surl">Google Sheet: indirizzo dello script</label>
    <input id="surl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" inputmode="url">
    <label for="skey">Chiave</label>
    <input id="skey" placeholder="La stessa scritta nello script" autocomplete="off" autocapitalize="off">
    <p class="hint" id="sstat" style="margin-top:8px"></p>
    <div class="btns"><button class="cancel" id="sunlink">Scollega</button><button class="save" id="ssave">Collega e sincronizza</button></div>
    <label>Versioni salvate in automatico</label>
    <div class="list" id="bsnaps"></div>
    <div class="btns"><button class="cancel" id="bclose">Chiudi</button></div>
  </div>
</div>

<script>
(function(){
  var KEY='spese-v1', CATS=['Cibo','Cavolate varie','Salute/spese mediche','Auto','Carburante','Spese personali','Studi','Bollette','Viaggi','Regali','Altro'];
  var FIX='Spese fisse',BCATS=[FIX].concat(CATS);
  var items=[], cur=new Date(), editing=null, cat=CATS[0];
  var eur=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
  var $=function(id){return document.getElementById(id)};

  try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
  // Le vecchie categorie vengono convertite in quelle nuove
  var MAP={Pasti:'Cibo',Casa:'Bollette',Trasporti:'Auto',Svago:'Cavolate varie',Salute:'Salute/spese mediche'};
  function migrate(a){if(Array.isArray(a))a.forEach(function(i){if(i&&CATS.indexOf(i.cat)<0)i.cat=MAP[i.cat]||'Altro'})}
  migrate(items);
  var BK='spese-budget',budget={};
  try{budget=JSON.parse(localStorage.getItem(BK)||'{}')||{}}catch(e){budget={}}
  if(budget.Pasti){if(!budget.Cibo)budget.Cibo=budget.Pasti;delete budget.Pasti}
  // Spese fisse: ogni voce ha una storia degli importi (da quale mese vale quale importo)
  var FK='spese-fixed',fixed=[];
  function cleanFixed(a){
    var ok=/^\d{4}-\d{2}$/;
    return (Array.isArray(a)?a:[]).filter(function(f){return f&&typeof f.name==='string'&&ok.test(f.start)&&Array.isArray(f.amts)&&f.amts.length&&f.amts.every(function(x){return x&&ok.test(x.from)&&isFinite(x.amt)})})
      .map(function(f){return {id:f.id||Date.now(),name:f.name,start:f.start,end:ok.test(f.end||'')?f.end:null,amts:f.amts.map(function(x){return {from:x.from,amt:+x.amt}}).sort(function(a,b){return a.from<b.from?-1:1})}});
  }
  try{fixed=cleanFixed(JSON.parse(localStorage.getItem(FK)||'[]'))}catch(e){fixed=[]}
  function saveFixed(){try{localStorage.setItem(FK,JSON.stringify(fixed))}catch(e){}snapshot();markDirty()}
  function fAmt(f,k){
    if(f.start>k||(f.end&&f.end<k))return null;
    var a=null;f.amts.forEach(function(x){if(x.from<=k&&(!a||x.from>=a.from))a=x});
    return a?a.amt:0;
  }
  function activeFixed(k){return fixed.map(function(f){var a=fAmt(f,k);return a===null?null:{f:f,amt:a}}).filter(Boolean)}
  function monthLabel(k){var q=k.split('-');return new Date(+q[0],+q[1]-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})}
  function prevYm(k){var q=k.split('-'),d=new Date(+q[0],+q[1]-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){$('err').textContent='Impossibile salvare: controlla lo spazio del browser.'}
    snapshot();
    markDirty();
  }
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function ym(d){return d.slice(0,7)}
  function curYm(){return cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')}

  function render(){
    var sp=tab==='spese';
    $('cats').style.display=sp?'':'none';$('list').style.display=sp?'':'none';$('bview').hidden=sp;$('add').style.display=sp?'':'none';
    var k=curYm(), mine=items.filter(function(i){return ym(i.date)===k}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
    var fx=activeFixed(k);
    $('month').textContent=new Date(cur.getFullYear(),cur.getMonth(),1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    var tot=mine.reduce(function(s,i){return s+i.amt},0);
    fx.forEach(function(x){tot+=x.amt});tot=r2(tot);
    $('total').textContent=eur.format(tot);
    var n=mine.length+fx.length;$('count').textContent=n===1?'1 spesa':n+' spese';
    renderBudget(mine,fx);
    var by={};mine.forEach(function(i){by[i.cat]=(by[i.cat]||0)+i.amt});
    fx.forEach(function(x){by[FIX]=r2((by[FIX]||0)+x.amt)});
    var cats=$('cats');cats.innerHTML='';
    Object.keys(by).sort(function(a,b){return by[b]-by[a]}).forEach(function(c){
      var d=document.createElement('div'),b=document.createElement('b');
      b.textContent=eur.format(by[c]);d.appendChild(b);d.appendChild(document.createTextNode(c));cats.appendChild(d);
    });
    var list=$('list');list.innerHTML='';
    drawFixed(list,fx);
    if(!mine.length){if(!fx.length){var e=document.createElement('div');e.className='empty';e.textContent='Nessuna spesa in questo mese. Tocca “Aggiungi spesa” per iniziare.';list.appendChild(e)}return}
    var groups={};mine.forEach(function(i){(groups[i.date]=groups[i.date]||[]).push(i)});
    Object.keys(groups).sort().reverse().forEach(function(day){
      var sum=groups[day].reduce(function(s,i){return s+i.amt},0);
      var h=document.createElement('div');h.className='day';
      var l=document.createElement('span');l.textContent=new Date(day+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
      var r=document.createElement('span');r.textContent=eur.format(sum);
      h.appendChild(l);h.appendChild(r);list.appendChild(h);
      var box=document.createElement('div');box.className='list';
      groups[day].forEach(function(i){
        var b=document.createElement('button');b.className='row';
        var t=document.createElement('div');t.className='t';
        t.textContent=i.cat;var s=document.createElement('small');s.textContent=i.note||'';if(i.note)t.appendChild(s);
        var a=document.createElement('div');a.className='a';a.textContent=eur.format(i.amt);
        b.appendChild(t);b.appendChild(a);b.onclick=function(){openSheet(i)};box.appendChild(b);
      });
      list.appendChild(box);
    });
  }

  var tab='spese';
  var eur0=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
  function r2(n){return Math.round(n*100)/100}
  function saveBudget(){try{localStorage.setItem(BK,JSON.stringify(budget))}catch(e){}snapshot()}
  function drawChart(tp,ta){
    var ch=$('chart'),max=Math.max(tp,ta,1),H=110;ch.innerHTML='';
    ch.setAttribute('aria-label','Confronto: previste '+eur0.format(tp)+', effettive '+eur0.format(ta));
    [['Previste',tp,'#8FA3BF'],['Effettive',ta,(tp>0&&ta>tp)?'var(--bad)':'var(--acc)']].forEach(function(x){
      var col=document.createElement('div');col.className='col';
      var b=document.createElement('b');b.textContent=eur0.format(x[1]);
      var bar=document.createElement('div');bar.className='bar';bar.style.height=Math.round(x[1]/max*H)+'px';bar.style.background=x[2];
      var l=document.createElement('small');l.textContent=x[0];
      col.appendChild(b);col.appendChild(bar);col.appendChild(l);ch.appendChild(col);
    });
  }
  function renderBudget(mine,fx){
    if(tab!=='budget')return;
    var act={};mine.forEach(function(i){act[i.cat]=(act[i.cat]||0)+i.amt});
    fx.forEach(function(x){act[FIX]=(act[FIX]||0)+x.amt});
    var t=$('bt');t.innerHTML='<thead><tr><th>Categoria</th><th>Previste</th><th>Effettive</th><th>Diff.</th></tr></thead>';
    var tb=document.createElement('tbody'),cells={};
    BCATS.forEach(function(c){
      var tr=document.createElement('tr'),n=document.createElement('td'),p=document.createElement('td'),inp=document.createElement('input'),a=document.createElement('td'),d=document.createElement('td');
      n.textContent=c;inp.setAttribute('inputmode','decimal');inp.setAttribute('aria-label','Spesa prevista: '+c);inp.placeholder='0';
      inp.value=budget[c]?String(budget[c]).replace('.',','):'';
      inp.onchange=function(){
        var v=parseFloat(inp.value.replace(/\s/g,'').replace(',','.'));if(!isFinite(v)||v<0)v=0;v=r2(v);
        if(v)budget[c]=v;else delete budget[c];
        inp.value=v?String(v).replace('.',','):'';saveBudget();upd();
      };
      p.appendChild(inp);[n,p,a,d].forEach(function(x){tr.appendChild(x)});tb.appendChild(tr);cells[c]={a:a,d:d};
    });
    t.appendChild(tb);
    var tf=document.createElement('tfoot'),fr=document.createElement('tr'),f=[0,1,2,3].map(function(){return document.createElement('td')});
    f[0].textContent='Totale';f.forEach(function(x){fr.appendChild(x)});tf.appendChild(fr);t.appendChild(tf);
    function upd(){
      var tp=0,ta=0,df;
      BCATS.forEach(function(c){
        var p=budget[c]||0,a=r2(act[c]||0);tp+=p;ta+=a;df=r2(p-a);
        cells[c].a.textContent=eur0.format(a);cells[c].d.textContent=eur0.format(df);cells[c].d.className=df<0?'neg':'';
      });
      tp=r2(tp);ta=r2(ta);df=r2(tp-ta);
      f[1].textContent=eur0.format(tp);f[2].textContent=eur0.format(ta);f[3].textContent=eur0.format(df);f[3].className=df<0?'neg':'';
      drawChart(tp,ta);
    }
    upd();
  }
  function setTab(x){tab=x;$('tabS').className=x==='spese'?'on':'';$('tabB').className=x==='budget'?'on':'';$('tabS').setAttribute('aria-pressed',x==='spese');$('tabB').setAttribute('aria-pressed',x==='budget');render()}
  $('tabS').onclick=function(){setTab('spese')};
  $('tabB').onclick=function(){setTab('budget')};

  function drawFixed(list,fx){
    var h=document.createElement('div');h.className='day';
    var l=document.createElement('span');l.textContent='Spese fisse';
    var a=document.createElement('button');a.className='mini';a.textContent='+ Aggiungi';a.onclick=function(){openFixed(null)};
    h.appendChild(l);h.appendChild(a);list.appendChild(h);
    var box=document.createElement('div');box.className='list';
    if(!fx.length){var t=document.createElement('div');t.className='hint';t.style.padding='14px';t.textContent='Qui trovi le spese che si ripetono ogni mese, come affitto o abbonamenti.';box.appendChild(t)}
    fx.forEach(function(x){
      var b=document.createElement('button');b.className='row';
      var t=document.createElement('div');t.className='t';t.textContent=x.f.name;
      var m=document.createElement('div');m.className='a';m.textContent=eur.format(x.amt);
      b.appendChild(t);b.appendChild(m);b.onclick=function(){openFixed(x.f,x.amt)};box.appendChild(b);
    });
    list.appendChild(box);
  }
  var fEdit=null;
  function openFixed(f,amt){
    fEdit=f||null;var k=curYm();
    $('ftitle').textContent=f?'Modifica spesa fissa':'Nuova spesa fissa';
    $('fname').value=f?f.name:'';
    $('famt').value=f?String(amt).replace('.',','):'';
    $('fhint').textContent=f?'L’importo cambia da '+monthLabel(k)+' in poi: i mesi precedenti restano invariati. Il nome vale per tutti i mesi.':'Comparirà ogni mese, a partire da '+monthLabel(k)+'.';
    $('fdel').hidden=!f;$('ferr').textContent='';
    $('fscrim').classList.add('on');
    setTimeout(function(){(f?$('famt'):$('fname')).focus()},50);
  }
  function closeFixed(){$('fscrim').classList.remove('on')}
  $('fsave').onclick=function(){
    var name=$('fname').value.trim(),v=parseFloat($('famt').value.replace(/\s/g,'').replace(',','.'));
    if(!name){$('ferr').textContent='Inserisci un nome.';return}
    if(!isFinite(v)||v<0){$('ferr').textContent='Inserisci un importo valido.';return}
    v=r2(v);var k=curYm();
    if(fEdit){fEdit.name=name;fEdit.amts=fEdit.amts.filter(function(x){return x.from<k});fEdit.amts.push({from:k,amt:v})}
    else fixed.push({id:Date.now(),name:name,start:k,end:null,amts:[{from:k,amt:v}]});
    saveFixed();closeFixed();render();
  };
  $('fdel').onclick=function(){
    if(!fEdit)return;var k=curYm();
    var target=fEdit;
    ask('Eliminare “'+target.name+'” da '+monthLabel(k)+' in poi? I mesi precedenti restano invariati.','Elimina',function(){
      if(target.start>=k)fixed=fixed.filter(function(f){return f!==target});else target.end=prevYm(k);
      saveFixed();closeFixed();render();
    },true);
  };
  $('fcancel').onclick=closeFixed;
  $('fscrim').onclick=function(e){if(e.target===this)closeFixed()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeFixed()});

  // Conferma dentro l'app (i popup del browser possono essere bloccati)
  var askCb=null;
  function ask(msg,label,cb,danger){
    askCb=cb;$('cmsg').textContent=msg;$('cyes').textContent=label;$('cyes').className='save'+(danger?' dang':'');
    $('cscrim').classList.add('on');
  }
  function closeAsk(){askCb=null;$('cscrim').classList.remove('on')}
  $('cyes').onclick=function(){var f=askCb;closeAsk();if(f)f()};
  $('cno').onclick=closeAsk;
  $('cscrim').onclick=function(e){if(e.target===this)closeAsk()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAsk()});

  function drawPick(){
    var p=$('pick');p.innerHTML='';
    CATS.forEach(function(c){
      var b=document.createElement('button');b.type='button';b.textContent=c;b.className=c===cat?'on':'';
      b.onclick=function(){cat=c;drawPick()};p.appendChild(b);
    });
  }
  function openSheet(item){
    editing=item||null;cat=item?item.cat:CATS[0];
    $('stitle').textContent=item?'Modifica spesa':'Nuova spesa';
    $('amt').value=item?String(item.amt).replace('.',','):'';
    $('note').value=item?item.note:'';
    $('date').value=item?item.date:iso(new Date());
    $('del').hidden=!item;$('err').textContent='';
    drawPick();$('scrim').classList.add('on');
    setTimeout(function(){$('amt').focus()},50);
  }
  function closeSheet(){$('scrim').classList.remove('on')}

  $('save').onclick=function(){
    var v=parseFloat($('amt').value.replace(/\s/g,'').replace(',','.'));
    if(!isFinite(v)||v<=0){$('err').textContent='Inserisci un importo maggiore di zero.';return}
    if(!$('date').value){$('err').textContent='Scegli una data.';return}
    var rec={amt:Math.round(v*100)/100,cat:cat,date:$('date').value,note:$('note').value.trim()};
    if(editing){Object.assign(editing,rec)}else{rec.id=Date.now();items.push(rec)}
    persist();
    var d=new Date(rec.date+'T12:00:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
    closeSheet();render();
  };
  $('del').onclick=function(){
    if(!editing)return;var target=editing;
    ask('Eliminare questa spesa?','Elimina',function(){items=items.filter(function(i){return i!==target});persist();closeSheet();render()},true);
  };
  $('cancel').onclick=closeSheet;
  $('scrim').onclick=function(e){if(e.target===this)closeSheet()};
  $('add').onclick=function(){openSheet(null)};
  $('prev').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
  $('next').onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

  // Colore principale e icona per la schermata Home
  var COLS=[['Rosso','#E22F2F'],['Arancione','#FB8A24'],['Giallo','#FDDD3A'],['Verde','#34A853'],['Azzurro','#38B6E5'],['Blu','#2F5BEA'],['Viola','#7B2CB0'],['Fucsia','#A62D84']];
  var CK='spese-color',accent=COLS[5][1];
  try{var sv=localStorage.getItem(CK);if(sv&&COLS.some(function(c){return c[1]===sv}))accent=sv}catch(e){}
  function rgb(h){return [1,3,5].map(function(i){return parseInt(h.substr(i,2),16)})}
  function hex(a){return '#'+a.map(function(v){return ('0'+Math.round(v).toString(16)).slice(-2)}).join('')}
  function isDark(){return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
  function applyAccent(){
    var a=rgb(accent),shown=isDark()?hex(a.map(function(v){return v+(255-v)*.3})):accent,sa=rgb(shown);
    var onacc=(0.299*sa[0]+0.587*sa[1]+0.114*sa[2])>140?'#10151D':'#FFFFFF';
    var st=document.documentElement.style;st.setProperty('--acc',shown);st.setProperty('--onacc',onacc);
    var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',shown);
  }
  var wheel=$('wheel');
  function mark(){
    [].forEach.call(wheel.querySelectorAll('button'),function(b){
      var on=b.getAttribute('data-c')===accent;
      b.setAttribute('aria-pressed',on);b.style.boxShadow=on?'0 0 0 4px var(--card),0 0 0 7px var(--ink)':'none';
    });
    var n=COLS.filter(function(c){return c[1]===accent})[0];$('cName').textContent=n?n[0]:'';
  }
  function closePop(){$('pop').classList.remove('on');$('cOpen').focus()}
  function openPop(){mark();$('pop').classList.add('on');var s=wheel.querySelector('[aria-pressed="true"]');if(s)s.focus()}
  COLS.forEach(function(c,i){
    var b=document.createElement('button'),ang=i*Math.PI/4;
    b.type='button';b.style.left=(50+33*Math.sin(ang))+'%';b.style.top=(50-33*Math.cos(ang))+'%';b.style.background=c[1];
    b.setAttribute('aria-label',c[0]);b.setAttribute('data-c',c[1]);
    b.onclick=function(){accent=c[1];try{localStorage.setItem(CK,accent)}catch(e){}applyAccent();mark();setTimeout(closePop,350)};
    wheel.appendChild(b);
  });
  $('cOpen').onclick=openPop;
  $('pop').onclick=function(e){if(e.target===this)closePop()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('pop').classList.contains('on'))closePop()});
  try{var mq=matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',applyAccent)}catch(e){}
  applyAccent();

  // Backup automatico: una copia in IndexedDB a ogni modifica (ultime 30)
  function idb(){return new Promise(function(res,rej){var r=indexedDB.open('spese-db',1);r.onupgradeneeded=function(){r.result.createObjectStore('snap',{keyPath:'t'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function snapshot(){idb().then(function(db){var s=db.transaction('snap','readwrite').objectStore('snap');s.put({t:Date.now(),items:JSON.parse(JSON.stringify(items)),budget:JSON.parse(JSON.stringify(budget)),fixed:JSON.parse(JSON.stringify(fixed))});var q=s.getAllKeys();q.onsuccess=function(){var k=q.result;while(k.length>60)s.delete(k.shift())}}).catch(function(){})}
  function snaps(){return idb().then(function(db){return new Promise(function(res){var r=db.transaction('snap').objectStore('snap').getAll();r.onsuccess=function(){res(r.result.sort(function(a,b){return b.t-a.t}))};r.onerror=function(){res([])}})}).catch(function(){return []})}
  function fdt(t){return new Date(t).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
  function applyItems(arr,bud,fix){
    migrate(arr);items=arr;
    if(bud&&typeof bud==='object'){var nb={};if(bud.Pasti&&!bud.Cibo)bud.Cibo=bud.Pasti;BCATS.forEach(function(c){var v=parseFloat(bud[c]);if(isFinite(v)&&v>0)nb[c]=v});budget=nb;try{localStorage.setItem(BK,JSON.stringify(budget))}catch(e){}}
    if(Array.isArray(fix)){fixed=cleanFixed(fix);try{localStorage.setItem(FK,JSON.stringify(fixed))}catch(e){}}
    persist();render();
  }
  var bsc=$('bscrim');
  function drawBackups(){snaps().then(function(s){
    $('bstat').textContent=s.length?'Ultimo backup automatico: '+fdt(s[0].t)+'. Ne viene creato uno a ogni modifica.':'Il primo backup automatico arriverà alla prossima modifica.';
    var box=$('bsnaps');box.innerHTML='';
    s.slice(0,10).forEach(function(x){
      var b=document.createElement('button');b.className='row';
      var t=document.createElement('div');t.className='t';t.textContent=fdt(x.t);
      var sm=document.createElement('small');sm.textContent=x.items.length+(x.items.length===1?' spesa':' spese');t.appendChild(sm);
      var a=document.createElement('div');a.className='a';a.style.color='var(--acc)';a.textContent='Ripristina';
      b.appendChild(t);b.appendChild(a);
      b.onclick=function(){ask('Ripristinare questa versione?','Ripristina',function(){applyItems(x.items,x.budget,x.fixed);bsc.classList.remove('on')})};
      box.appendChild(b);
    });
  })}
  $('bopen').onclick=function(){var c=cfg();$('surl').value=c?c.url:'';$('skey').value=c?c.key:'';describe();drawBackups();bsc.classList.add('on')};
  $('bclose').onclick=function(){bsc.classList.remove('on')};
  bsc.onclick=function(e){if(e.target===this)bsc.classList.remove('on')};
  $('bexp').onclick=function(){
    var f=new File([JSON.stringify({app:'spese',v:3,items:items,budget:budget,fixed:fixed},null,1)],'spese-backup-'+iso(new Date())+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){})}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  };
  $('bimp').onclick=function(){$('bfile').click()};
  $('bfile').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{
      var d=JSON.parse(r.result),arr=Array.isArray(d)?d:d.items;
      if(!Array.isArray(arr)||!arr.every(function(i){return i&&isFinite(i.amt)&&i.date&&i.cat}))throw 0;
      ask('Importare '+arr.length+' spese? Sostituiranno quelle attuali.','Importa',function(){arr.forEach(function(i,n){if(!i.id)i.id=Date.now()+n;i.note=i.note||''});applyItems(arr,Array.isArray(d)?null:d.budget,Array.isArray(d)?null:d.fixed);bsc.classList.remove('on')});
    }catch(e){$('bstat').textContent='File non valido: scegli un backup creato da questa app.'}};
    r.readAsText(f);this.value='';
  };
  // Se i dati principali mancano ma esiste un backup, proponi il ripristino
  var hasMain=true;try{hasMain=localStorage.getItem(KEY)!==null}catch(e){}
  if(!hasMain)snaps().then(function(s){if(s.length&&s[0].items.length)ask('Ho trovato un backup automatico del '+fdt(s[0].t)+' con '+s[0].items.length+' spese. Vuoi ripristinarlo?','Ripristina',function(){applyItems(s[0].items,s[0].budget,s[0].fixed)})});

  // Sincronizzazione automatica con Google Sheet (stato completo, riprova se offline)
  var SK='spese-sync',DK='spese-dirty',timer=null,busy=false,rev=0;
  function cfg(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}}
  function setCfg(c){try{if(c)localStorage.setItem(SK,JSON.stringify(c));else localStorage.removeItem(SK)}catch(e){}}
  function dirty(v){try{if(v===undefined)return localStorage.getItem(DK)==='1';if(v)localStorage.setItem(DK,'1');else localStorage.removeItem(DK)}catch(e){}}
  function sstat(m){$('sstat').textContent=m}
  function describe(){var c=cfg();if(!c){sstat('Non collegato: le spese restano solo sul telefono.');return}sstat(dirty()?'In attesa di sincronizzazione…':(c.last?'Sincronizzato il '+fdt(c.last)+'.':'Collegato.'))}
  function post(c,payload){
    var body=JSON.stringify(payload),h={'Content-Type':'text/plain;charset=utf-8'};
    return fetch(c.url,{method:'POST',headers:h,body:body}).then(function(r){return r.json()}).catch(function(){
      return fetch(c.url,{method:'POST',mode:'no-cors',headers:h,body:body}).then(function(){return {ok:true}});
    });
  }
  function sync(){
    var c=cfg();if(!c||!dirty()||busy)return;
    if(navigator.onLine===false){describe();return}
    busy=true;sstat('Sincronizzazione…');var sent=rev;
    post(c,{key:c.key,items:JSON.parse(JSON.stringify(items)),fixed:fixedRows()}).then(function(res){
      busy=false;
      if(res&&res.ok){c.last=Date.now();c.ym=nowYm();setCfg(c);if(rev===sent)dirty(false);describe();if(rev!==sent)sync()}
      else sstat('Errore: '+((res&&res.error)||'risposta non valida')+'.');
    }).catch(function(){busy=false;describe()});
  }
  function nowYm(){return iso(new Date()).slice(0,7)}
  function nextYm(k){var q=k.split('-'),d=new Date(+q[0],+q[1],1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  // Spese fisse "spalmate" mese per mese, dall'inizio fino al mese corrente (o all'ultimo mese con spese)
  function fixedRows(){
    var last=nowYm(),out=[];
    items.forEach(function(i){var m=ym(i.date);if(m>last)last=m});
    fixed.forEach(function(f){
      var k=f.start,guard=0;
      while(k<=last&&guard++<600){
        if(f.end&&k>f.end)break;
        var a=fAmt(f,k);if(a!==null)out.push({month:k,name:f.name,amt:a});
        k=nextYm(k);
      }
    });
    return out;
  }
  function checkMonth(){var c=cfg();if(c&&c.ym!==nowYm()){rev++;dirty(true)}}
  function markDirty(){if(!cfg())return;rev++;dirty(true);clearTimeout(timer);timer=setTimeout(sync,1500)}
  $('ssave').onclick=function(){
    var url=$('surl').value.trim(),key=$('skey').value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){sstat('Indirizzo non valido: deve finire con /exec.');return}
    if(!key){sstat('Inserisci la chiave.');return}
    setCfg({url:url,key:key});rev++;dirty(true);sync();
  };
  $('sunlink').onclick=function(){ask('Scollegare il Google Sheet? Il foglio resta com’è.','Scollega',function(){setCfg(null);dirty(false);$('surl').value='';$('skey').value='';describe()})};
  window.addEventListener('online',sync);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){checkMonth();sync()}});
  checkMonth();sync();

  // Offline e archiviazione persistente
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});

  render();
})();
</script>
</body>
</html>
